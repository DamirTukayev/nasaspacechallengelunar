name: Keep demo backend awake

# Render's free plan puts a service to sleep after 15 minutes without requests,
# and waking it takes about a minute. A ping every 10 minutes keeps the demo instant.
# One service running all month fits in Render's 750 free instance hours.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          API_URL: ${{ vars.API_URL || 'https://lunar-site-planner-api.onrender.com' }}
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 10 "$API_URL/health"
