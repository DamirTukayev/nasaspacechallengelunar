# Render Blueprint for the live demo backend: https://render.com/docs/blueprint-spec
# Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: lunar-site-planner-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # The GitHub Pages frontend. Add more origins comma-separated.
      - key: CORS_ORIGINS
        value: https://damirtukayev.github.io
